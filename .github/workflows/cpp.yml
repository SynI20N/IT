name: C/C++ CI

on:
  push:
    branches: [ "parallel" ]
  pull_request:
    branches: [ "parallel" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y googletest libgtest-dev build-essential gcovr

    - name: Navigate to lab4
      run: cd lab4 && ls -la

    - name: Check for Makefile
      run: |
        if [ ! -f "lab4/Makefile" ]; then
          echo "Error: Makefile not found in lab4/"
          exit 1
        fi

    - name: Compile main
      run: cd lab4 && make

    - name: Run main
      run: cd lab4 && ./main

    - name: Compile unit tests with coverage
      run: cd lab4 && make coverage

    - name: Run unit tests
      run: cd lab4 && ./main

    - name: Generate coverage report
      run: cd lab4 && gcovr -r . --xml-pretty -o coverage.xml --gcov-ignore-parse-errors

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
